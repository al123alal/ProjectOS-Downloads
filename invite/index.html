<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Project in ProjectOS</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(460px, calc(100% - 40px));
      padding: 40px;
      background: #171a21;
      border: 1px solid #2b303b;
      border-radius: 16px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #b8bec9;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin-top: 16px;
      padding: 15px 20px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      background: white;
      color: #111318;
    }

    .secondary {
      background: #292e38;
      color: white;
    }

    #error {
      display: none;
      color: #ff8c8c;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>ProjectOS Invitation</h1>

    <p>
      You've been invited to collaborate on a ProjectOS project.
    </p>

    <a id="openProject" class="button" href="#">
      Open Project in ProjectOS
    </a>

    <a
      class="button secondary"
      href="https://github.com/al123alal/ProjectOS-Downloads/releases/latest/download/desktop_0.1.0_x64-setup.exe"
    >
      Download ProjectOS for Windows
    </a>

    <p id="error">
      This invitation link is missing its invite token.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const openButton = document.getElementById("openProject");
    const error = document.getElementById("error");

    if (token) {
      openButton.href =
        "projectos://invite/" + encodeURIComponent(token);
    } else {
      openButton.style.display = "none";
      error.style.display = "block";
    }
  </script>
</body>
</html>
